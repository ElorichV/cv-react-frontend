name: Frontend Quality Gate (Contracts + TypeScript + Vite Build)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (Lockfile enforced)
        run: npm ci

      - name: Run i18n Cross-Boundary Contract & D20 Logic Tests
        run: npm test

      - name: Build production artifact (TypeScript + Vite bundle)
        run: npm run build
